<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Electro Inmuebles MG | Alquileres CABA</title>
<link rel="canonical" href="https://mercadopagolink.github.io/electro-inmuebles-mg/"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222}
header{background:#1a1a2e;color:#fff;padding:.8rem 1rem}
.brand{color:#fff;text-decoration:none;font-weight:700}.brand span{color:#ff5500}
.hero{max-width:1140px;margin:0 auto;padding:1rem}
.box{max-width:1140px;margin:0 auto .8rem;padding:0 1rem}
.inner{background:#fff;border-radius:14px;padding:.9rem}
.row{display:flex;flex-wrap:wrap;gap:.4rem}
.row input,.row select{flex:1;min-width:90px;padding:.55rem .7rem;border:1.5px solid #ddd;border-radius:10px}
.row button{padding:.55rem .85rem;border:0;border-radius:10px;background:#ff5500;color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.chips button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:.3rem .6rem;font-size:.75rem}
.chips button.on{background:#1a1a2e;color:#fff}
.meta{max-width:1140px;margin:0 auto .5rem;padding:0 1rem;font-size:.82rem;color:#666}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;max-width:1140px;margin:0 auto;padding:0 1rem 1rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.card a{text-decoration:none;color:inherit}
.cimg{aspect-ratio:4/3;background:#eee}.cimg img{width:100%;height:100%;object-fit:cover}
.cb{padding:.7rem .85rem 1rem}.price{font-size:1.1rem;font-weight:800;color:#ff5500}
h2{font-size:.86rem;margin-top:.15rem}
.specs{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.35rem}
.spec{background:#f0f0f0;border-radius:999px;padding:.2rem .45rem;font-size:.68rem}
.zona{font-size:.72rem;color:#666;margin-top:.2rem}
.loading{text-align:center;padding:2rem;color:#666;grid-column:1/-1}
</style>
</head>
<body>
<header><a class="brand" href="index.html">Electro <span>Inmuebles MG</span></a></header>
<div class="hero"><h1>Alquileres en Capital Federal</h1><p>100 departamentos con mas de 7 fotos. Consulta dentro de esta web.</p></div>
<div class="box"><div class="inner">
<div class="row">
<input type="search" id="q" placeholder="Buscar barrio o titulo"/>
<select id="amb"><option value="">Ambientes</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4+</option></select>
<button type="button" id="btnBuscar">Buscar</button>
</div>
<div class="chips" id="chips"></div>
</div></div>
<div class="meta" id="meta">Cargando...</div>
<div class="grid" id="grid"><div class="loading">Cargando...</div></div>
<script>
let ALL=[],filtered=[];
function an(a){const m=String(a||"").match(/(\d+)/);return m?parseInt(m[1],10):0}
function card(d){
  const img=(d.photos&&d.photos[0])||d.main||"logo.svg";
  const specs=[d.ambientes,d.dormitorios,d.banos,d.m2].filter(Boolean).map(s=>'<span class="spec">'+s+'</span>').join("");
  return '<div class="card"><a href="depto.html?id='+encodeURIComponent(d.id)+'"><div class="cimg"><img src="'+img+'" alt="" loading="lazy"></div><div class="cb"><div class="price">'+(d.price||"Consultar")+'</div><h2>'+(d.title||"Departamento")+'</h2>'+(d.zona?'<div class="zona">'+d.zona+'</div>':'')+'<div class="specs">'+specs+'</div></div></a></div>';
}
function apply(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase();
  const amb=document.getElementById("amb").value;
  const zc=document.querySelector(".chips button.on");
  const zona=zc&&zc.dataset.zona!=="todos"?zc.dataset.zona.toLowerCase():"";
  filtered=ALL.filter(d=>{
    if(q){const h=((d.title||"")+" "+(d.zona||"")).toLowerCase();if(!h.includes(q))return false}
    if(zona&&!(d.zona||"").toLowerCase().includes(zona))return false;
    if(amb){const n=an(d.ambientes);if(amb==="4"){if(n<4)return false}else if(n!==parseInt(amb,10))return false}
    return true;
  });
  document.getElementById("grid").innerHTML=filtered.length?filtered.map(card).join(""):'<div class="loading">Sin resultados</div>';
  document.getElementById("meta").textContent=filtered.length+" departamentos";
}
fetch("data.json").then(r=>r.json()).then(function(list){
  ALL=Array.isArray(list)?list:[];
  const zs=["todos"].concat(Array.from(new Set(ALL.map(d=>(d.zona||"").split(",")[0].trim()).filter(Boolean))).slice(0,12));
  document.getElementById("chips").innerHTML=zs.map((z,i)=>'<button type="button" data-zona="'+z+'" class="'+(i===0?"on":"")+'">'+(z==="todos"?"Todos":z)+"</button>").join("");
  document.querySelectorAll(".chips button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".chips button").forEach(b=>b.classList.remove("on"));btn.classList.add("on");apply()});
  document.getElementById("btnBuscar").onclick=apply;
  document.getElementById("amb").onchange=apply;
  filtered=ALL.slice();apply();
}).catch(()=>{document.getElementById("grid").innerHTML='<div class="loading">Error al cargar data.json</div>'});
</script>
</body>
</html>
